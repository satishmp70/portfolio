<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cmsCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="400" rx="12" fill="url(#cmsBg)"/>

  <!-- Top Bar -->
  <rect width="640" height="38" fill="#1e293b" fill-opacity="0.7"/>
  <line x1="0" y1="38" x2="640" y2="38" stroke="#334155" stroke-width="0.8"/>
  <circle cx="20" cy="19" r="4.5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="4.5" fill="#f59e0b"/>
  <circle cx="52" cy="19" r="4.5" fill="#10b981"/>
  <rect x="160" y="8" width="320" height="22" rx="5" fill="#0f172a" stroke="#334155" stroke-width="0.75"/>
  <text x="320" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">omnipress.studio/editor/articles/global-tech-summit</text>

  <!-- Left Sidebar (CMS Content Types) -->
  <rect x="0" y="38" width="130" height="362" fill="#0b1120" fill-opacity="0.8"/>
  <line x1="130" y1="38" x2="130" y2="400" stroke="#1e293b" stroke-width="1"/>
  
  <text x="16" y="60" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">CONTENT TYPES</text>
  <rect x="10" y="70" width="110" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.4"/>
  <text x="24" y="86" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Articles (85k)</text>
  <text x="24" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Landing Pages</text>
  <text x="24" y="136" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Authors &amp; Bios</text>
  <text x="24" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Media Library</text>

  <text x="16" y="200" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">REGIONS (8)</text>
  <text x="24" y="222" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5">● US (en-US)</text>
  <text x="24" y="244" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">○ UK (en-GB)</text>
  <text x="24" y="266" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">○ DE (de-DE)</text>
  <text x="24" y="288" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">○ JP (ja-JP)</text>

  <!-- Main Editorial Canvas -->
  <g transform="translate(144, 48)">
    <!-- Header Controls -->
    <rect x="0" y="0" width="310" height="42" rx="8" fill="url(#cmsCard)" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Global Tech Summit 2026 Keynote</text>
    <rect x="236" y="12" width="62" height="18" rx="4" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="0.8"/>
    <text x="267" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">PUBLISHED</text>

    <!-- Content Block 1: Structured Fields -->
    <rect x="0" y="52" width="310" height="180" rx="8" fill="url(#cmsCard)" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="74" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">SLUG &amp; SEO TITLE</text>
    <rect x="14" y="82" width="282" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
    <text x="24" y="98" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">/insights/2026-global-tech-summit-keynote</text>

    <text x="14" y="124" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">STRUCTURED BODY CONTENT (GRAPHQL READY)</text>
    <rect x="14" y="132" width="282" height="88" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
    <text x="24" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">"The future of distributed software platforms relies on</text>
    <text x="24" y="166" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">edge-rendered content meshes with instantaneous cache</text>
    <text x="24" y="182" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">invalidation across multi-region deployment hubs..."</text>
    <text x="24" y="204" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5">+ RichMediaBlock(hero_banner_4k.webp)</text>

    <!-- Bottom Status Panel -->
    <rect x="0" y="242" width="310" height="96" rx="8" fill="url(#cmsCard)" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="262" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Multi-Region Edge Sync Status</text>
    <circle cx="20" cy="282" r="3.5" fill="#10b981"/>
    <text x="30" y="286" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5">CloudFront Edge Purge: 18ms (Global OK)</text>
    <circle cx="20" cy="306" r="3.5" fill="#10b981"/>
    <text x="30" y="310" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5">Next.js ISR Webhook: 200 OK (8 Regions)</text>
  </g>

  <!-- Right Side: Live Multi-Device Preview Mock -->
  <g transform="translate(466, 48)">
    <rect x="0" y="0" width="160" height="336" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="80" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">LIVE EDGE PREVIEW</text>
    <rect x="12" y="38" width="136" height="64" rx="6" fill="#6366f1" fill-opacity="0.3"/>
    <rect x="12" y="110" width="136" height="10" rx="3" fill="#38bdf8"/>
    <rect x="12" y="126" width="100" height="6" rx="2" fill="#475569"/>
    <rect x="12" y="138" width="124" height="6" rx="2" fill="#334155"/>
    <rect x="12" y="150" width="116" height="6" rx="2" fill="#334155"/>
    
    <rect x="12" y="170" width="64" height="16" rx="4" fill="#3b82f6"/>
    <text x="44" y="181" fill="#ffffff" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Read More</text>

    <!-- Mobile Device Frame Mock -->
    <rect x="24" y="206" width="112" height="116" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="80" cy="216" r="2" fill="#64748b"/>
    <rect x="32" y="226" width="96" height="28" rx="4" fill="#6366f1" fill-opacity="0.3"/>
    <rect x="32" y="260" width="96" height="6" rx="2" fill="#38bdf8"/>
    <rect x="32" y="272" width="70" height="4" rx="2" fill="#475569"/>
  </g>
</svg>
