<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="saasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="saasCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cyanArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="400" rx="12" fill="url(#saasBg)"/>

  <!-- Browser/Window Header -->
  <rect width="640" height="38" fill="#1e293b" fill-opacity="0.6"/>
  <line x1="0" y1="38" x2="640" y2="38" stroke="#334155" stroke-width="0.8"/>
  <circle cx="20" cy="19" r="4.5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="4.5" fill="#f59e0b"/>
  <circle cx="52" cy="19" r="4.5" fill="#10b981"/>
  <rect x="180" y="8" width="280" height="22" rx="5" fill="#0f172a" stroke="#334155" stroke-width="0.75"/>
  <text x="320" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">cloudmetrics.app/dashboard/analytics</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="120" height="362" fill="#0b1120" fill-opacity="0.6"/>
  <line x1="120" y1="38" x2="120" y2="400" stroke="#1e293b" stroke-width="1"/>
  
  <rect x="14" y="54" width="92" height="22" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3"/>
  <text x="32" y="69" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Telemetry</text>
  <text x="32" y="99" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Tenants</text>
  <text x="32" y="129" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Billing &amp; Invoices</text>
  <text x="32" y="159" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">API Keys</text>

  <!-- Top KPI Cards -->
  <g transform="translate(136, 50)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="150" height="64" rx="8" fill="url(#saasCard)" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">MONTHLY MRR</text>
    <text x="12" y="42" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">$184,250</text>
    <text x="12" y="56" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="600">↑ 14.2% MoM</text>

    <!-- Card 2 -->
    <rect x="162" y="0" width="150" height="64" rx="8" fill="url(#saasCard)" stroke="#1e293b" stroke-width="1"/>
    <text x="174" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">EVENT VOLUME</text>
    <text x="174" y="42" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">12.4M <tspan font-size="9" fill="#64748b">ev/day</tspan></text>
    <text x="174" y="56" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="600">● 100% Ingested</text>

    <!-- Card 3 -->
    <rect x="324" y="0" width="164" height="64" rx="8" fill="url(#saasCard)" stroke="#1e293b" stroke-width="1"/>
    <text x="336" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">P99 QUERY LATENCY</text>
    <text x="336" y="42" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">82 ms</text>
    <text x="336" y="56" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="8" font-weight="600">TimescaleDB Indexed</text>
  </g>

  <!-- Big Graph Section -->
  <g transform="translate(136, 126)">
    <rect x="0" y="0" width="488" height="150" rx="8" fill="url(#saasCard)" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="20" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Real-Time Usage &amp; Automated Invoicing Streams</text>
    <line x1="14" y1="55" x2="474" y2="55" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="0.75"/>
    <line x1="14" y1="95" x2="474" y2="95" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="0.75"/>

    <!-- Chart Path -->
    <path d="M 14 125 Q 70 85 130 105 T 240 60 T 350 78 T 440 45 T 474 52 L 474 135 L 14 135 Z" fill="url(#cyanArea)"/>
    <path d="M 14 125 Q 70 85 130 105 T 240 60 T 350 78 T 440 45 T 474 52" fill="none" stroke="url(#cyanLine)" stroke-width="2.5"/>

    <circle cx="440" cy="45" r="4" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
    <rect x="390" y="16" width="94" height="20" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="0.8"/>
    <text x="437" y="29" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">14.8k events/s</text>
  </g>

  <!-- Bottom Data Grid / Live Webhooks -->
  <g transform="translate(136, 288)">
    <rect x="0" y="0" width="488" height="96" rx="8" fill="url(#saasCard)" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="20" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Recent Stripe Automated Invoicing Events</text>
    
    <!-- Row 1 -->
    <text x="14" y="42" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">inv_9841_ent</text>
    <text x="140" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Apex Cloud Inc.</text>
    <text x="270" y="42" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">$4,850.00</text>
    <rect x="390" y="32" width="84" height="14" rx="3" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="0.6"/>
    <text x="432" y="42" fill="#34d399" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">PAID &amp; RECONCILED</text>

    <!-- Row 2 -->
    <text x="14" y="68" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">inv_9842_pro</text>
    <text x="140" y="68" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">DataMesh Labs</text>
    <text x="270" y="68" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">$1,290.00</text>
    <rect x="390" y="58" width="84" height="14" rx="3" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="0.6"/>
    <text x="432" y="68" fill="#34d399" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">PAID &amp; RECONCILED</text>
  </g>
</svg>
