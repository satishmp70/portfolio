<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="finCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="400" rx="12" fill="url(#finBg)"/>

  <!-- Top Bar -->
  <rect width="640" height="38" fill="#1e293b" fill-opacity="0.7"/>
  <line x1="0" y1="38" x2="640" y2="38" stroke="#334155" stroke-width="0.8"/>
  <circle cx="20" cy="19" r="4.5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="4.5" fill="#f59e0b"/>
  <circle cx="52" cy="19" r="4.5" fill="#10b981"/>
  <rect x="160" y="8" width="320" height="22" rx="5" fill="#0f172a" stroke="#334155" stroke-width="0.75"/>
  <text x="320" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">finvault.gateway/ledger/settlements</text>

  <!-- Top Metrics Row -->
  <g transform="translate(16, 48)">
    <rect x="0" y="0" width="194" height="68" rx="8" fill="url(#finCard)" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">MONTHLY SETTLEMENTS</text>
    <text x="14" y="44" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="700">$18,420,950</text>
    <text x="14" y="58" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="600">● 32 Global Currencies</text>

    <rect x="206" y="0" width="194" height="68" rx="8" fill="url(#finCard)" stroke="#1e293b" stroke-width="1"/>
    <text x="220" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">AVG SETTLEMENT LATENCY</text>
    <text x="220" y="44" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="700">114 ms</text>
    <text x="220" y="58" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Go Microservices + Kafka</text>

    <rect x="412" y="0" width="196" height="68" rx="8" fill="url(#finCard)" stroke="#1e293b" stroke-width="1"/>
    <text x="426" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">LEDGER RECONCILIATION</text>
    <text x="426" y="44" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="700">100.00%</text>
    <text x="426" y="58" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Double-Entry Cryptographic</text>
  </g>

  <!-- Main Ledger Table -->
  <g transform="translate(16, 126)">
    <rect x="0" y="0" width="608" height="258" rx="10" fill="url(#finCard)" stroke="#1e293b" stroke-width="1"/>
    
    <text x="16" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Real-Time Multi-Currency Ledger Stream</text>
    <rect x="490" y="12" width="102" height="22" rx="4" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="0.8"/>
    <circle cx="502" cy="23" r="3" fill="#10b981"/>
    <text x="510" y="26" fill="#34d399" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">KAFKA STREAM LIVE</text>

    <!-- Table Header -->
    <text x="16" y="54" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">TX HASH</text>
    <text x="150" y="54" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SOURCE &gt; DEST</text>
    <text x="290" y="54" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">AMOUNT (FX)</text>
    <text x="420" y="54" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">LEDGER STATUS</text>
    <text x="540" y="54" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">LATENCY</text>
    <line x1="16" y1="62" x2="592" y2="62" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="16" y="86" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">0x8a91f...4c2d</text>
    <text x="150" y="86" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">USD (Chase) → EUR (DB)</text>
    <text x="290" y="86" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">$125,000.00 <tspan fill="#64748b" font-size="8.5">(€114,890)</tspan></text>
    <rect x="420" y="74" width="76" height="16" rx="3" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="0.6"/>
    <text x="458" y="86" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">RECONCILED</text>
    <text x="540" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">88ms</text>

    <!-- Row 2 -->
    <text x="16" y="122" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">0x3b12a...98ef</text>
    <text x="150" y="122" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">GBP (Barclays) → USD</text>
    <text x="290" y="122" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">£84,500.00 <tspan fill="#64748b" font-size="8.5">($108,160)</tspan></text>
    <rect x="420" y="110" width="76" height="16" rx="3" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="0.6"/>
    <text x="458" y="122" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">RECONCILED</text>
    <text x="540" y="122" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">96ms</text>

    <!-- Row 3 -->
    <text x="16" y="158" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">0x7e88c...11a0</text>
    <text x="150" y="158" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">SGD (DBS) → JPY (MUFG)</text>
    <text x="290" y="158" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">S$62,000.00 <tspan fill="#64748b" font-size="8.5">(¥6.9M)</tspan></text>
    <rect x="420" y="146" width="76" height="16" rx="3" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="0.6"/>
    <text x="458" y="158" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">RECONCILED</text>
    <text x="540" y="158" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">104ms</text>

    <!-- Row 4 -->
    <text x="16" y="194" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">0x1f44d...88b2</text>
    <text x="150" y="194" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">AUD (ANZ) → USD</text>
    <text x="290" y="194" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">A$45,000.00 <tspan fill="#64748b" font-size="8.5">($29,700)</tspan></text>
    <rect x="420" y="182" width="76" height="16" rx="3" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="0.6"/>
    <text x="458" y="194" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">RECONCILED</text>
    <text x="540" y="194" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">74ms</text>

    <!-- Footer Audit Proof Note -->
    <rect x="16" y="218" width="576" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
    <text x="26" y="234" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="8.5">Merkle Tree Root #88941 verified • Zero discrepancy across 1,840,290 historical journal ledger entries</text>
  </g>
</svg>
