<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engineering Case Study — Vistarsolution</title>
  <meta name="description" content="Detailed engineering case study, challenges, architecture solutions, and measurable outcomes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>
  <!-- Top utility bar -->
  <div class="top-bar">
    <div class="container top-bar-inner">
      <div class="top-bar-left">
        <a href="mailto:hello@vistarsolution.com" id="topBarEmail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span>hello@vistarsolution.com</span></a>
        <a href="tel:+917021067824" id="topBarPhone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>+91 70210 67824</span></a>
      </div>
      <div class="top-bar-right">
        <span id="topBarLocation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg><span>Nalasopara West</span></span>
        <div class="top-bar-socials" id="topBarSocials"></div>
      </div>
    </div>
  </div>

  <header class="site-header scrolled">
    <div class="container nav-container">
      <a href="/" class="brand-logo" id="csBrandLogo" aria-label="Vistarsolution Home">
        <img src="/images/logo/logo.png" alt="Vistarsolution" class="brand-logo-img" width="720" height="188" />
      </a>

      <div class="nav-actions">
        <a href="/projects/" class="btn btn-secondary btn-sm">&larr; All Work</a>
        <a href="/contact/" class="btn btn-primary btn-sm">Book a Consultation</a>
      </div>
    </div>
  </header>

  <main class="case-study-page">
    <div class="container container-narrow" id="caseStudyContainer">
      <!-- Injected dynamically based on URL parameter ?id=project-id -->
      <div class="not-found">
        <p>Loading case study…</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer minimal">
    <div class="container">
      <div class="footer-bottom">
        <div id="csFooterCopyright">© 2026 Vistarsolution LLP. All rights reserved.</div>
        <div><a href="/" class="footer-link">Return to Home</a></div>
      </div>
    </div>
  </footer>

  <script type="module">
    import { getSiteData } from '/src/js/dataLoader.js';
    import { getIcon } from '/src/js/icons.js';

    async function loadStandaloneCaseStudy() {
      const siteData = await getSiteData();
      if (!siteData) return;

      const brandName = document.getElementById('csCompanyName');
      const footerCopyright = document.getElementById('csFooterCopyright');
      if (brandName) brandName.textContent = siteData.company.shortName || siteData.company.name;
      if (footerCopyright) footerCopyright.textContent = `© ${new Date().getFullYear()} ${siteData.company.legalName || siteData.company.name}. All rights reserved.`;

      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('id');
      const project = siteData.projects.find(p => p.id === projectId);
      const container = document.getElementById('caseStudyContainer');
      if (!container) return;

      if (!project) {
        document.title = `Case Study Not Found — ${siteData.company.name}`;
        container.innerHTML = `
          <div class="not-found">
            <h2>Case Study Not Found</h2>
            <p>The requested case study could not be located.</p>
            <a href="/projects/" class="btn btn-primary">Return to Projects</a>
          </div>
        `;
        return;
      }

      document.title = `${project.title} — Case Study | ${siteData.company.name}`;
      const cs = project.caseStudy || {};
      const metrics = cs.results || [];
      const features = cs.keyFeatures || [];
      const processSteps = cs.developmentProcess || [];
      const technologies = project.technologies || [];
      // Only real URLs get a "Visit live site" link (sample projects use "#…" placeholders)
      const liveUrl = /^https?:\/\//.test(project.url || '') ? project.url : '';

      container.innerHTML = `
        <div class="case-study-header">
          <div class="case-study-meta">
            <span class="project-badge">${project.category}</span>
            ${project.isPlaceholder ? '<span class="sample-tag">SAMPLE PROJECT</span>' : ''}
            <small>${project.clientType || ''}</small>
            ${liveUrl ? `<a href="${liveUrl}" target="_blank" rel="noopener noreferrer" class="link-arrow">Visit live site ${getIcon('externalLink')}</a>` : ''}
          </div>
          <h1 class="page-title">${project.title}</h1>
          <p class="case-study-lead">${cs.headline || project.description}</p>
        </div>

        <img src="${project.image}" alt="${project.title}" class="case-study-hero-img" />

        ${metrics.length ? `
          <div class="case-study-section">
            <h3 class="case-study-section-title">${getIcon('target')} Measurable Production Impact</h3>
            <div class="metrics-grid">
              ${metrics.map(m => `
                <div class="metric-card">
                  <div class="metric-value">${m.metric}</div>
                  <div class="metric-label">${m.label}</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${cs.overview ? `
          <div class="case-study-section">
            <h3 class="case-study-section-title">${getIcon('layers')} Overview</h3>
            <p>${cs.overview}</p>
          </div>
        ` : ''}

        <div class="case-study-section challenge-solution">
          <div class="cs-block challenge">
            <h4>Technical Challenge &amp; Constraints</h4>
            <p>${cs.challenge || 'High-throughput scaling and complex enterprise state requirements.'}</p>
          </div>
          <div class="cs-block solution">
            <h4>Architectural Solution</h4>
            <p>${cs.solution || 'Engineered modular microservices with distributed caching and multi-tenant security isolation.'}</p>
          </div>
        </div>

        ${features.length ? `
          <div class="case-study-section">
            <h3 class="case-study-section-title">${getIcon('check')} Key Engineering Features</h3>
            <ul class="feature-list boxed">
              ${features.map(f => `<li>${getIcon('check')}<span>${f}</span></li>`).join('')}
            </ul>
          </div>
        ` : ''}

        ${processSteps.length ? `
          <div class="case-study-section">
            <h3 class="case-study-section-title">${getIcon('layers')} Delivery Roadmap</h3>
            <ul class="roadmap-list">
              ${processSteps.map(step => `
                <li>
                  <strong>${step.phase}</strong>
                  <span>${step.detail}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        ` : ''}

        <div class="case-study-section">
          <h3 class="case-study-section-title">${getIcon('cpu')} Technology Foundation</h3>
          <div class="tag-list">
            ${technologies.map(t => `<span class="tech-tag">${t}</span>`).join('')}
          </div>
          ${cs.architectureNotes ? `<p class="arch-note">${cs.architectureNotes}</p>` : ''}
        </div>

        <div class="cta-card">
          <div class="cta-inner">
<div class="cta-content">
            <h2 class="cta-headline">Need an architecture like this?</h2>
            <p class="cta-subtext">Let's discuss how we can adapt this blueprint for your organization.</p>
          </div>
          <div class="cta-action">
            ${liveUrl ? `<a href="${liveUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-lg">Visit live site ${getIcon('externalLink')}</a>` : ''}
            <a href="/contact/" class="btn btn-white btn-lg">Book a Consultation</a>
          </div>
          </div>
        </div>
      `;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadStandaloneCaseStudy);
    } else {
      loadStandaloneCaseStudy();
    }
  </script>
</body>
</html>
