<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engineering Case Study — Diyaseva Technologies</title>
  <meta name="description" content="Detailed engineering case study, challenges, architecture solutions, and measurable outcomes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header scrolled">
    <div class="container nav-container">
      <a href="/" class="brand-logo" id="csBrandLogo">
        <div class="brand-icon">DS</div>
        <span id="csCompanyName">Diyaseva Technologies</span>
      </a>

      <div class="nav-actions">
        <a href="/projects/" class="btn btn-secondary btn-sm">
          ← Back to Selected Work
        </a>
        <a href="/contact/" class="btn btn-primary btn-sm">
          Book a Consultation
        </a>
      </div>
    </div>
  </header>

  <main style="padding-top: calc(var(--header-height) + 40px); padding-bottom: 80px;">
    <div class="container container-narrow" id="caseStudyContainer">
      <!-- Injected dynamically based on URL parameter ?id=project-id -->
      <div style="text-align: center; padding: 60px 0;">
        <p style="color: var(--text-muted);">Loading case study data...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <div id="csFooterCopyright">© 2026 Diyaseva Technologies, Inc. All rights reserved.</div>
        <div><a href="/" class="footer-link">Return to Home</a></div>
      </div>
    </div>
  </footer>

  <script type="module">
    import { getSiteData } from '/src/js/dataLoader.js';
    import { getIcon } from '/src/js/icons.js';

    async function loadStandaloneCaseStudy() {
      const siteData = await getSiteData();
      if (!siteData) return;

      // Update Branding
      const brandName = document.getElementById('csCompanyName');
      const footerCopyright = document.getElementById('csFooterCopyright');
      if (brandName) brandName.textContent = siteData.company.name;
      if (footerCopyright) footerCopyright.textContent = `© ${new Date().getFullYear()} ${siteData.company.name}. All rights reserved.`;

      // Get project ID from query params
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('id') || (siteData.projects[0] ? siteData.projects[0].id : null);
      
      const project = siteData.projects.find(p => p.id === projectId) || siteData.projects[0];
      const container = document.getElementById('caseStudyContainer');

      if (!project || !container) {
        if (container) {
          container.innerHTML = `
            <div style="text-align: center; padding: 80px 0;">
              <h2>Case Study Not Found</h2>
              <p style="color: var(--text-muted); margin-bottom: 24px;">The requested case study could not be located.</p>
              <a href="/projects/" class="btn btn-primary">Return to Projects</a>
            </div>
          `;
        }
        return;
      }

      document.title = `${project.title} — Case Study | ${siteData.company.name}`;
      const cs = project.caseStudy || {};
      const metrics = cs.results || [];
      const features = cs.keyFeatures || [];
      const processSteps = cs.developmentProcess || [];
      const technologies = project.technologies || [];

      container.innerHTML = `
        <div style="margin-bottom: 36px;">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;">
            <span class="project-badge" style="position: static;">${project.category}</span>
            <span style="font-size: 0.85rem; color: var(--text-subtle);">${project.clientType || ''}</span>
          </div>

          <h1 style="font-size: clamp(2rem, 4vw, 2.8rem); margin-bottom: 16px;">${project.title}</h1>
          <p style="font-size: 1.2rem; color: var(--text-primary); font-weight: 500; line-height: 1.5; margin-bottom: 24px;">
            ${project.description}
          </p>

          <div style="border-radius: var(--radius-xl); overflow: hidden; margin-bottom: 40px; border: 1px solid var(--border-subtle); box-shadow: var(--shadow-lg);">
            <img src="${project.image}" alt="${project.title}" style="width: 100%; height: auto; display: block;" />
          </div>
        </div>

        <!-- Metrics Grid -->
        ${metrics.length ? `
          <div style="margin-bottom: 48px;">
            <h3 style="font-size: 1.3rem; margin-bottom: 20px;">Measurable Production Impact</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
              ${metrics.map(m => `
                <div class="stat-card" style="text-align: left;">
                  <div class="stat-value" style="font-size: 2rem;">${m.metric}</div>
                  <div class="stat-label" style="margin-bottom: 4px;">${m.label}</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- Technical Challenges & Architecture -->
        <div style="display: grid; grid-template-columns: 1fr; gap: 32px; margin-bottom: 48px;">
          <div class="glass-card" style="padding: 32px;">
            <h3 style="font-size: 1.3rem; margin-bottom: 14px; color: #e11d48; display: flex; align-items: center; gap: 8px;">
              Technical Challenge & Constraints
            </h3>
            <p style="color: var(--text-secondary); line-height: 1.7; font-size: 1.05rem;">
              ${cs.challenge || 'High-throughput scaling and complex enterprise state requirements.'}
            </p>
          </div>

          <div class="glass-card" style="padding: 32px; border-color: var(--accent-blue-subtle);">
            <h3 style="font-size: 1.3rem; margin-bottom: 14px; color: var(--accent-blue); display: flex; align-items: center; gap: 8px;">
              Architectural Solution & Implementation
            </h3>
            <p style="color: var(--text-secondary); line-height: 1.7; font-size: 1.05rem;">
              ${cs.solution || 'Engineered modular serverless microservices with distributed caching and multi-tenant security isolation.'}
            </p>
          </div>
        </div>

        <!-- Technologies Used -->
        <div style="margin-bottom: 48px;">
          <h3 style="font-size: 1.3rem; margin-bottom: 16px;">Technology Foundation</h3>
          <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            ${technologies.map(t => `<span class="tech-tag" style="font-size: 0.95rem; padding: 6px 14px;">${t}</span>`).join('')}
          </div>
        </div>

        <!-- Key Engineering Features -->
        ${features.length ? `
          <div style="margin-bottom: 48px;">
            <h3 style="font-size: 1.3rem; margin-bottom: 20px;">Key Engineering Features</h3>
            <ul class="service-deliverables" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              ${features.map(f => `
                <li class="service-deliverable-item" style="background: var(--bg-secondary); padding: 14px 18px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
                  ${getIcon('check')}
                  <span>${f}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        ` : ''}

        <!-- CTA Callout -->
        <div class="cta-card" style="margin-top: 60px;">
          <div class="cta-content">
            <h2 class="cta-headline">Need an architecture like this?</h2>
            <p class="cta-subtext">Let's discuss how we can adapt this architectural blueprint for your organization.</p>
          </div>
          <div class="cta-action">
            <a href="/contact/" class="btn btn-white btn-lg">Book a Consultation</a>
          </div>
        </div>
      `;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadStandaloneCaseStudy);
    } else {
      loadStandaloneCaseStudy();
    }
  </script>
</body>
</html>
